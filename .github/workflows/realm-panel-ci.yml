name: realm-panel CI

on:
  push:
    branches:
      - feat/realm-panel
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - feat/realm-panel
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  realm-panel:
    name: Build & Test realm_panel (x86_64-linux)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: realm_panel
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: realm_panel/frontend/package-lock.json

      - name: Build frontend assets
        working-directory: realm_panel/frontend
        run: |
          npm ci
          npm run build

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: realm_panel

      - name: Check & Test realm_panel
        env:
          RUSTC_BOOTSTRAP: "1"
        run: |
          cargo check --tests
          cargo test

      - name: Build release binary
        env:
          RUSTC_BOOTSTRAP: "1"
        run: cargo build --release

      - name: Package release binary
        run: |
          mkdir -p target/dist
          cp target/release/realm-panel target/dist/realm-panel-linux-x86_64
          tar -C target/dist -zcf target/dist/realm-panel-linux-x86_64.tar.gz realm-panel-linux-x86_64
          (cd target/dist && sha256sum realm-panel-linux-x86_64 realm-panel-linux-x86_64.tar.gz > realm-panel-linux-x86_64.sha256)

      - name: Upload realm-panel artifact
        uses: actions/upload-artifact@v4
        with:
          name: realm-panel-linux-x86_64
          path: realm_panel/target/dist/*

  upstream-realm:
    name: Verify Upstream realm Workspace
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Run upstream workspace tests
        env:
          RUSTUP_TOOLCHAIN: stable
          RUSTC_BOOTSTRAP: "1"
        run: cargo test --workspace

  publish-release:
    name: Publish GitHub Release
    needs: [realm-panel, upstream-realm]
    if: |
      github.event_name != 'pull_request' &&
      (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/feat/realm-panel' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    steps:
      - name: Download realm-panel artifact
        uses: actions/download-artifact@v4
        with:
          name: realm-panel-linux-x86_64
          path: release-assets

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            release-assets/realm-panel-linux-x86_64
            release-assets/realm-panel-linux-x86_64.tar.gz
            release-assets/realm-panel-linux-x86_64.sha256

      - name: Publish dev-latest prerelease
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: dev-latest
          target_commitish: ${{ github.sha }}
          name: "Realm Panel Dev Build (feat/realm-panel)"
          prerelease: true
          make_latest: false
          body: |
            Automated build from commit `${{ github.sha }}` on `${{ github.ref_name }}`.
            Download `realm-panel-linux-x86_64.tar.gz` (single binary with embedded Web UI).
          files: |
            release-assets/realm-panel-linux-x86_64
            release-assets/realm-panel-linux-x86_64.tar.gz
            release-assets/realm-panel-linux-x86_64.sha256
